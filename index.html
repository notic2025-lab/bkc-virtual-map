<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GFO 北館1F バーチャルマップ | GRAND FRONT OSAKA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏙️</text></svg>">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>

<div id="app">
  <canvas id="scene"></canvas>

  <!-- ヘッダー -->
  <header id="topbar">
    <div class="brand">
      <span class="brand-mark">GFO</span>
      <div class="brand-txt">
        <strong>グランフロント大阪</strong>
        <small>北館 1F バーチャルマップ</small>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="btn-night" class="chip-btn" title="昼/夜切替">🌙</button>
      <button id="btn-walk" class="chip-btn" title="お散歩モード">🚶</button>
      <button id="btn-list" class="chip-btn" title="ショップ一覧">☰ ショップ</button>
    </div>
  </header>

  <!-- カテゴリフィルタ -->
  <div id="filters">
    <button class="filter-chip active" data-cat="all">すべて</button>
    <button class="filter-chip" data-cat="fashion"><i style="background:#c5ca00"></i>ファッション</button>
    <button class="filter-chip" data-cat="interior"><i style="background:#00979d"></i>インテリア</button>
    <button class="filter-chip" data-cat="cafe"><i style="background:#e8a800"></i>カフェ・レストラン</button>
    <button class="filter-chip" data-cat="kc"><i style="background:#e62b67"></i>ナレッジキャピタル</button>
  </div>

  <!-- 地図操作 -->
  <div id="map-controls" aria-label="地図操作">
    <button id="btn-north" type="button" title="北を上に戻す"><span>↑</span><small>北</small></button>
    <button id="btn-zoom-in" type="button" title="拡大">＋</button>
    <button id="btn-zoom-out" type="button" title="縮小">−</button>
  </div>
  <div id="zoom-hint"><span>＋</span> 拡大すると店舗情報を表示</div>

  <!-- ショップ一覧ドロワー -->
  <aside id="drawer">
    <div class="drawer-head">
      <input id="search" type="search" placeholder="ショップを検索…">
      <button id="drawer-close" class="icon-btn">✕</button>
    </div>
    <div id="shop-list"></div>
  </aside>

  <!-- ショップ情報カード -->
  <div id="shop-card" class="hidden">
    <button id="card-close" class="icon-btn">✕</button>
    <div class="card-logo"><img id="card-logo-img" alt=""></div>
    <div class="card-body">
      <span id="card-tag" class="card-tag"></span>
      <h2 id="card-name"></h2>
      <p id="card-en" class="card-en"></p>
      <p id="card-desc"></p>
      <div class="card-actions">
        <button id="card-goto" class="primary-btn">🧭 ここへ行く</button>
        <a id="card-link" href="#" target="_blank" rel="noopener" class="ghost-btn">公式ページ ↗</a>
      </div>
    </div>
  </div>

  <!-- 経路パネル -->
  <div id="route-panel">
    <button id="route-panel-toggle" type="button" aria-expanded="true" aria-controls="route-panel-body">
      <span class="route-handle" aria-hidden="true"></span>
      <span id="route-panel-title">経路を検索</span>
      <span class="route-toggle-icon" aria-hidden="true">⌄</span>
    </button>
    <div id="route-panel-body">
    <div class="route-row">
      <span class="dot dot-start"></span>
      <select id="route-from"></select>
    </div>
    <div class="route-row">
      <span class="dot dot-goal"></span>
      <select id="route-to"></select>
    </div>
    <div class="route-actions">
      <button id="btn-route" class="primary-btn">経路を表示</button>
      <button id="btn-ar" class="ar-btn" disabled>📱 ARナビ</button>
      <button id="btn-clear" class="ghost-btn small">クリア</button>
    </div>
    <div id="route-info" class="hidden"></div>
    </div>
  </div>

  <!-- トースト -->
  <div id="toast" class="hidden"></div>

  <!-- ARビュー -->
  <div id="ar-view" class="hidden">
    <video id="ar-video" autoplay muted playsinline></video>
    <canvas id="ar-canvas"></canvas>
    <div id="ar-hud">
      <div id="ar-instruction">経路を読み込み中…</div>
      <div id="ar-distance"></div>
      <div class="ar-controls">
        <button id="ar-prev" class="chip-btn">◀ 前へ</button>
        <button id="ar-next" class="chip-btn">次へ ▶</button>
        <button id="ar-exit" class="chip-btn danger">終了</button>
      </div>
    </div>
  </div>

  <!-- ローディング -->
  <div id="loader">
    <div class="loader-inner">
      <div class="loader-ring"></div>
      <p>バーチャルマップを構築中…</p>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
